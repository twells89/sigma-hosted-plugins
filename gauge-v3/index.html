<!DOCTYPE html><html><head><meta charset="utf-8"><title>gauge-v3 DIAG</title>
<style>html,body{margin:0;font:16px/1.4 monospace;padding:10px;background:#fff}</style></head>
<body><pre id="o">init...</pre>
<script src="./react.production.min.js"></script>
<script src="./sigmacomputing-plugin.umd.js"></script>
<script>
var L=[]; function show(){document.getElementById('o').textContent=L.join('\n');}
L.push('React='+(typeof window.React)+'  SigmaPlugin='+(typeof window.SigmaPlugin));
var c=(window.SigmaPlugin&&window.SigmaPlugin.client)||null;
L.push('client='+(c?'YES':'NO'));
show();
if(c){
  try{
    c.config.configureEditorPanel([{name:'source',type:'element'},{name:'value',type:'column',source:'source'},{name:'target',type:'column',source:'source'}]);
    L.push('configureEditorPanel: ok'); show();
  }catch(e){L.push('configureEditorPanel THREW: '+e.message);show();}
  try{
    c.config.subscribe(function(cfg){
      L.push('config.subscribe FIRED: source='+(cfg&&cfg.source)+' value='+(cfg&&cfg.value)+' target='+(cfg&&cfg.target)); show();
      if(cfg&&cfg.source){
        c.elements.subscribeToElementData(cfg.source,function(data){
          var ks=data?Object.keys(data):[];
          L.push('DATA FIRED: keys='+JSON.stringify(ks));
          if(cfg.value&&data&&data[cfg.value])L.push('  value['+cfg.value+'][0]='+data[cfg.value][0]);
          if(cfg.target&&data&&data[cfg.target])L.push('  target['+cfg.target+'][0]='+data[cfg.target][0]);
          show();
        });
        L.push('subscribeToElementData: registered for '+cfg.source); show();
      }
    });
    L.push('config.subscribe: registered'); show();
  }catch(e){L.push('config.subscribe THREW: '+e.message);show();}
}
</script></body></html>
